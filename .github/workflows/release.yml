name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: ra_fetch_gui
            archive_name: ra_fetch_gui-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: ra_fetch_gui.exe
            archive_name: ra_fetch_gui-windows-x86_64.zip
          # Versión macOS Apple Silicon (M1/M2/M3)
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: ra_fetch_gui
            archive_name: ra_fetch_gui-macos-arm64.tar.gz
          # Versión macOS Intel
          - os: macos-14
            target: x86_64-apple-darwin
            bin_name: ra_fetch_gui
            archive_name: ra_fetch_gui-macos-x86_64.tar.gz

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Instalar dependencias de Linux (GUI y Red)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Compilar Release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Empaquetar para Linux y macOS
        if: matrix.os == 'ubuntu-22.04' || startsWith(matrix.os, 'macos')
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.archive_name }} ${{ matrix.bin_name }}

      - name: Empaquetar para Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.bin_name }} -DestinationPath ../../../${{ matrix.archive_name }}

      - name: Crear Release y subir binarios
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
          generate_release_notes: true
